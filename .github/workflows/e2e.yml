name: E2E

# Vercel reports each deployment as a commit status ("Vercel"). Once a deployment of main
# succeeds, production is live; test it there. Previews are behind Vercel Authentication.
on:
  status:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://retro-meeting.andreasknoor.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
